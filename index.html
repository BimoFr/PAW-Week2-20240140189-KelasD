<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum W2</title>
</head>
<body>
    <header>
        <h1>UMKM Pengrajin Batik dan Tenun</h1>
        <p>Warisan Budaya, Karya Tangan Anak Bangsa</p>
    </header>
    <nav>
        <a href="#profile">profile</a>
        <a href="#formdata">form</a>
    </nav>

        <img src="batik.webp" alt="gambar sidik jelek" width="700">

    <section id="profile">
        <h3>Formulir Pemesanan</h3>
        <p>Berikut adalah formulir untuk melakukan pemesanan produk batik dan tenun kami.</p>
    </section>
    <form id="formdata" action="#">
        <label for="nama">Nama Pemesan:</label>
        <input type="text" id="nama" name="nama">
        <fieldset id="Pilihan Produk">
            <legend>Pilihan Produk</legend>
            <input type="radio" name="produk" id="kain" value="kain">
            <label for="kain">Kain Batik</label>
            <br>
            <input type="radio" name="produk" id="pakaian" value="pakaian">
            <label for="pakaian">Pakaian Jadi (Kemeja/Blus)</label>
        </fieldset>
        </form>
</body>
</html>
